services:
  - type: web
    name: drivelegal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: OLLAMA_TIMEOUT_S
        value: "5"
      - key: DATABASE_PATH
        value: /data/drivelegal.db
      - key: CHROMA_PATH
        value: /data/chroma
      - key: DEFAULT_COUNTRY
        value: IN
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
